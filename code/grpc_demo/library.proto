// Chapter 12: the library as a gRPC service.
// Generate the Python code (from inside grpc_demo/):
//   python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. library.proto
syntax = "proto3";

package library.v1;

message Book {
  int32 id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
}

message GetBookRequest {
  int32 id = 1;
}

message ListBooksRequest {
  string author = 1;      // empty means all authors
}

service Library {
  rpc GetBook(GetBookRequest) returns (Book);                 // unary: one request, one reply
  rpc ListBooks(ListBooksRequest) returns (stream Book);      // server streaming: one request, many replies
}
